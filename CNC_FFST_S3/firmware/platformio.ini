[platformio]
src_dir = main
include_dir = main
default_envs = cnc_ffst_s3_n16r8_uart

[env]
extra_scripts = pre:scripts/prepare_ffst_key.py
platform = espressif32@5.3.0
framework = espidf
board = esp32-s3-devkitc-1
board_build.partitions = partitions_ffst_16m.csv
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_upload.flash_size = 16MB
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS=sdkconfig.ffst.defaults
monitor_speed = 115200
build_flags =
    -DOVERRIDE_MY_MACHINE
    -DBOARD_MY_MACHINE
    -DCNC_FFST_AUTH=1
    -DN_AXIS=4
    -DN_SPINDLE=1
    -DSPINDLE0_ENABLE=SPINDLE_PWM0_NODIR
    -DPROBE_ENABLE=1
    -DCONTROL_ENABLE=70
    -DESTOP_ENABLE=1
    -DRGB_LED_ENABLE=0
    -DWIFI_ENABLE=0
    -DBLUETOOTH_ENABLE=0
    -DSDCARD_ENABLE=0
    -DCOOLANT_ENABLE=0
    -DDEFAULT_FORCE_INITIALIZATION_ALARM=1
    -DDEFAULT_STEP_PULSE_MICROSECONDS=5.0f
    -DDEFAULT_STEP_PULSE_DELAY=2.0f
    -DDEFAULT_ENABLE_SIGNALS_INVERT_MASK=15
    -DDEFAULT_LIMIT_SIGNALS_INVERT_MASK=15
    -DDEFAULT_PROBE_SIGNAL_INVERT=0
    -DDEFAULT_CONTROL_SIGNALS_INVERT_MASK=0
    -DDEFAULT_HARD_LIMIT_ENABLE=1
    -DDEFAULT_LASER_MODE=1
    -DBUILD_INFO='"CNC_FFST-S3-0.1.0"'
    -DLINE_BUFFER_SIZE=768
    -DRX_BUFFER_SIZE=1024
    -Wno-missing-field-initializers

[env:cnc_ffst_s3_n16r8_uart]
build_flags = ${env.build_flags} -DUSB_SERIAL_CDC=0

[env:cnc_ffst_s3_n16r8_usb]
build_flags = ${env.build_flags} -DUSB_SERIAL_CDC=1
